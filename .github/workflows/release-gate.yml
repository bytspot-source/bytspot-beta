name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # The mark is drawn on nine surfaces across two repos and three of this
      # repo's four had silently fallen a revision behind the favicon.
      - name: Brand mark geometry
        run: npm run assert:brand-mark

      - name: Unit tests
        run: npm run test:unit

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit advisory
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: App Store purity build
        run: npm run build:app-store

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Release smoke E2E
        run: npm run release:e2e:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
