
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Bytspot</title>

      <meta name="theme-color" content="#000000" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="apple-touch-icon" href="/icon-192.png" />

      <meta name="description" content="Open Bytspot on iPhone to discover places nearby, make plans with friends and join parties. Links open in the native app and App Clip — not the old web app." />
      <link rel="canonical" href="https://bytspot.app/" />
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Bytspot" />
      <meta property="og:title" content="Bytspot" />
      <meta property="og:description" content="Open Bytspot on iPhone to discover places nearby, make plans with friends and join parties. Links open in the native app or App Clip." />
      <meta property="og:url" content="https://bytspot.app/" />
      <meta property="og:image" content="https://bytspot.app/media/bytspot-og.png" />
      <meta property="og:image:secure_url" content="https://bytspot.app/media/bytspot-og.png" />
      <meta property="og:image:type" content="image/png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="Bytspot" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Bytspot" />
      <meta name="twitter:description" content="Open Bytspot on iPhone to discover places nearby, make plans with friends and join parties. Links open in the native app or App Clip." />
      <meta name="twitter:image" content="https://bytspot.app/media/bytspot-og.png" />

      <!-- Search-result structured data. Claims stay inside what the product
           actually does: a native iPhone app with an App Clip. No ratings,
           no offers, no "live" occupancy — unverifiable markup is a
           manual-action risk and would contradict the Typical/Live contract. -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://bytspot.app/#organization",
            "name": "Bytspot",
            "url": "https://bytspot.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://bytspot.app/icon-512.png",
              "width": 512,
              "height": 512
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://bytspot.app/#website",
            "url": "https://bytspot.app/",
            "name": "Bytspot",
            "description": "Open Bytspot on iPhone to discover places nearby, make plans with friends and join parties. Links open in the native app or App Clip.",
            "publisher": { "@id": "https://bytspot.app/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "MobileApplication",
            "@id": "https://bytspot.app/#app",
            "name": "Bytspot",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "iOS",
            "url": "https://apps.apple.com/app/id6761876421",
            "installUrl": "https://apps.apple.com/app/id6761876421",
            "publisher": { "@id": "https://bytspot.app/#organization" },
            "image": "https://bytspot.app/media/bytspot-og.png"
          }
        ]
      }
      </script>

      <!-- Smart App Banner — default argument is this page, never the retired
           Platinum /p/app-clip catalog. JS below rewrites /party/<id> and
           patch URLs before iOS caches the card. -->
      <script src="/app-banner.js"></script>
      <meta name="apple-itunes-app" content="app-id=6761876421, app-clip-bundle-id=com.bytspot.app.Clip, app-clip-display=card, app-argument=https://bytspot.app/" />
    </head>

    <body>
      <div id="root"></div>
      <script src="/app-boot.js"></script>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
